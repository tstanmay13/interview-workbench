  </textarea>
  <script>
    (() => {
      const source = document.querySelector('#source').value.replace(/^\n/, '');
      const deck = document.querySelector('#deck');
      const trace = document.querySelector('#trace');
      const statusPattern = /\b(PASS|PARTIAL|FAILED|UNVERIFIED|REJECTED)\b/g;

      const escapeHtml = (value) => value
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');

      const inline = (value) => {
        let safe = escapeHtml(value);
        const tokens = [];
        const tokenFor = (html) => {
          const token = `\u0000${tokens.length}\u0000`;
          tokens.push(html);
          return token;
        };
        const decorate = (text) => text
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/_([^_]+)_/g, '<em>$1</em>')
          .replace(statusPattern, (status) =>
            `<span class="status" data-status="${status.toLowerCase()}">${status}</span>`);

        safe = safe.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
          const allowed = !/^[a-z][a-z0-9+.-]*:/i.test(url) || /^https?:\/\//i.test(url);
          return allowed ? tokenFor(`<a href="${url}" rel="noreferrer">${decorate(label)}</a>`) : label;
        });
        safe = safe.replace(/`([^`]+)`/g, (_, codeValue) => tokenFor(`<code>${codeValue}</code>`));
        safe = decorate(safe);
        return safe.replace(/\u0000(\d+)\u0000/g, (_, index) => tokens[Number(index)]);
      };

      const slug = (value, index) => {
        const base = value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        return base || `section-${index}`;
      };

      const mermaidLabel = (token) => {
        const clean = token.trim();
        const shaped = clean.match(/^[a-zA-Z0-9_-]+(?:\[(.*?)\]|\((.*?)\)|\{(.*?)\})$/);
        return (shaped ? shaped.slice(1).find(Boolean) : clean).replace(/^["']|["']$/g, '');
      };
      const renderMermaidFlow = (lines) => {
        const paths = lines
          .filter((line) => !/^\s*(flowchart|graph)\b/i.test(line) && !/^\s*%%/.test(line))
          .map((line) => line.split(/\s*-->\s*/).map(mermaidLabel))
          .filter((nodes) => nodes.length > 1);
        if (!paths.length) return null;
        const label = paths.flat().join(' then ');
        const body = paths.map((nodes) => `<div class="flow-path">${nodes.map((node, index) => `${index ? '<span class="flow-arrow" aria-hidden="true">→</span>' : ''}<span class="flow-node">${inline(node)}</span>`).join('')}</div>`).join('');
        return `<div class="flow-diagram" role="img" aria-label="${escapeHtml(label)}">${body}</div>`;
      };
      const renderCode = (language, lines) => {
        if (language.toLowerCase() === 'mermaid') {
          const diagram = renderMermaidFlow(lines);
          if (diagram) return diagram;
        }
        return `<pre data-language="${escapeHtml(language)}"><code>${escapeHtml(lines.join('\n'))}</code></pre>`;
      };

      const isTableRow = (line) => /^\s*\|.*\|\s*$/.test(line);
      const isSeparator = (line) => /^\s*\|(?:\s*:?-+:?\s*\|)+\s*$/.test(line);
      const cells = (line) => line.trim().slice(1, -1).split('|').map((cell) => cell.trim());

      const lines = source.split(/\r?\n/);
      let title = 'Interview evidence brief';
      let thesis = '';
      let heroExtras = [];
      const sections = [];
      let current = null;
      let paragraph = [];
      let list = null;
      let code = null;

      const target = () => current ? current.blocks : heroExtras;
      const flushParagraph = () => {
        if (!paragraph.length) return;
        target().push(`<p>${inline(paragraph.join(' '))}</p>`);
        paragraph = [];
      };
      const closeList = () => {
        if (!list) return;
        target().push(`<${list.type}>${list.items.map((item) => `<li>${inline(item)}</li>`).join('')}</${list.type}>`);
        list = null;
      };
      const flush = () => { flushParagraph(); closeList(); };

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        if (code) {
          if (/^```/.test(line)) {
            target().push(renderCode(code.language, code.lines));
            code = null;
          } else code.lines.push(line);
          continue;
        }
        const fence = line.match(/^```\s*(.*)$/);
        if (fence) { flush(); code = { language: fence[1] || 'text', lines: [] }; continue; }
        const h1 = line.match(/^#\s+(.+)$/);
        if (h1) { flush(); title = h1[1]; continue; }
        const h2 = line.match(/^##\s+(.+)$/);
        if (h2) {
          flush();
          current = { title: h2[1], id: slug(h2[1], sections.length + 1), blocks: [] };
          sections.push(current);
          continue;
        }
        const h3 = line.match(/^###\s+(.+)$/);
        if (h3) { flush(); target().push(`<h3>${inline(h3[1])}</h3>`); continue; }
        const quote = line.match(/^>\s?(.*)$/);
        if (quote) {
          flush();
          if (!current && !thesis) thesis = quote[1];
          else target().push(`<blockquote>${inline(quote[1])}</blockquote>`);
          continue;
        }
        const bullet = line.match(/^\s*[-*]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (bullet || ordered) {
          flushParagraph();
          const type = bullet ? 'ul' : 'ol';
          if (list && list.type !== type) closeList();
          if (!list) list = { type, items: [] };
          list.items.push((bullet || ordered)[1]);
          continue;
        }
        if (isTableRow(line) && index + 1 < lines.length && isSeparator(lines[index + 1])) {
          flush();
          const header = cells(line);
          index += 2;
          const rows = [];
          while (index < lines.length && isTableRow(lines[index])) {
            rows.push(cells(lines[index]));
            index += 1;
          }
          index -= 1;
          const table = `<div class="table-wrap"><table><thead><tr>${header.map((cell) => `<th>${inline(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${inline(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
          target().push(table);
          continue;
        }
        if (!line.trim()) { flush(); continue; }
        paragraph.push(line.trim());
      }
      flush();
      if (code) target().push(renderCode(code.language, code.lines));

      document.title = title;
      const hero = document.createElement('section');
      hero.className = 'hero';
      hero.id = 'overview';
      hero.innerHTML = `<h1>${inline(title)}</h1>${thesis ? `<blockquote>${inline(thesis)}</blockquote>` : ''}${heroExtras.join('')}<div class="legend" aria-label="Evidence statuses"><span class="status" data-status="pass">PASS</span><span class="status" data-status="partial">PARTIAL</span><span class="status" data-status="failed">FAILED</span><span class="status" data-status="unverified">UNVERIFIED</span></div>`;
      deck.append(hero);

      sections.forEach((section, index) => {
        const element = document.createElement('section');
        element.className = 'section';
        element.id = section.id;
        element.dataset.step = String(index + 1).padStart(2, '0');
        element.innerHTML = `<h2>${inline(section.title)}</h2>${section.blocks.join('') || '<div class="empty">No evidence recorded yet.</div>'}`;
        deck.append(element);
      });

      const navigable = [hero, ...deck.querySelectorAll('.section')];
      navigable.forEach((section, index) => {
        const label = index === 0 ? 'Overview' : sections[index - 1].title;
        const link = document.createElement('a');
        link.href = `#${section.id}`;
        link.textContent = label;
        if (index === 0) link.classList.add('active');
        trace.append(link);
      });

      let activeIndex = 0;
      const go = (offset) => {
        activeIndex = Math.max(0, Math.min(navigable.length - 1, activeIndex + offset));
        navigable[activeIndex].scrollIntoView({ block: 'start' });
      };
      document.querySelector('#previous').addEventListener('click', () => go(-1));
      document.querySelector('#next').addEventListener('click', () => go(1));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight' || event.key === 'PageDown') go(1);
        if (event.key === 'ArrowLeft' || event.key === 'PageUp') go(-1);
        if (event.key.toLowerCase() === 'p') window.print();
      });

      const observer = new IntersectionObserver((entries) => {
        const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!visible) return;
        activeIndex = navigable.indexOf(visible.target);
        [...trace.querySelectorAll('a')].forEach((link, index) => link.classList.toggle('active', index === activeIndex));
      }, { rootMargin: '-20% 0px -60%', threshold: [0.1, 0.5] });
      navigable.forEach((section) => observer.observe(section));
    })();
  </script>
</body>
</html>
