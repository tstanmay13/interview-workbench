<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interview evidence brief</title>
  <style>
    :root {
      --paper: #f4f7f8;
      --surface: #ffffff;
      --ink: #17222c;
      --muted: #5f6e78;
      --line: #cbd6dc;
      --blue: #285b91;
      --blue-soft: #dceaf4;
      --teal: #197266;
      --teal-soft: #dceeea;
      --amber: #a85722;
      --amber-soft: #f7e8d8;
      --red: #a33b3b;
      --red-soft: #f5dddd;
      --gray-soft: #e8edf0;
      --shadow: 0 14px 40px rgba(30, 53, 68, 0.08);
      --display: Charter, "Iowan Old Style", Georgia, serif;
      --body: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(40, 91, 145, 0.035) 1px, transparent 1px) 0 0 / 24px 24px,
        var(--paper);
      font-family: var(--body);
      line-height: 1.58;
    }

    button, a { font: inherit; }
    a { color: var(--blue); text-underline-offset: 0.18em; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

    .topbar {
      position: fixed;
      z-index: 20;
      inset: 0 0 auto 0;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(244, 247, 248, 0.94);
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: baseline; gap: 12px; }
    .brand strong { font-family: var(--display); font-size: 20px; }
    .brand span { color: var(--muted); font: 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
    .actions { display: flex; gap: 8px; }
    .actions button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      padding: 7px 13px;
      cursor: pointer;
    }

    .shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 900px);
      gap: clamp(28px, 5vw, 72px);
      max-width: 1240px;
      margin: 0 auto;
      padding: 98px 32px 80px;
    }

    .trace {
      position: sticky;
      top: 90px;
      align-self: start;
      max-height: calc(100vh - 120px);
      overflow: auto;
      padding: 8px 0 20px 18px;
      border-left: 2px solid var(--line);
    }
    .trace::before {
      content: "Trace";
      display: block;
      margin: 0 0 14px;
      color: var(--muted);
      font: 11px var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .trace a {
      position: relative;
      display: block;
      margin: 0 0 5px;
      padding: 7px 8px;
      border-radius: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
    }
    .trace a::before {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      left: -23px;
      top: 13px;
      border: 2px solid var(--paper);
      border-radius: 50%;
      background: var(--line);
    }
    .trace a.active { color: var(--ink); background: var(--blue-soft); }
    .trace a.active::before { background: var(--blue); }

    main { min-width: 0; }
    .hero {
      position: relative;
      overflow: hidden;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid #adc2d1;
      border-radius: 3px 28px 3px 3px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 9px;
      background: linear-gradient(var(--blue), var(--teal));
    }
    .hero::after {
      content: "Evidence → decision → outcome";
      position: absolute;
      top: 22px;
      right: 26px;
      color: var(--muted);
      font: 10px var(--mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .hero h1 {
      max-width: 760px;
      margin: 0 0 20px;
      font-family: var(--display);
      font-size: clamp(42px, 7vw, 76px);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.035em;
    }
    .hero blockquote {
      max-width: 680px;
      margin: 0;
      padding: 0;
      border: 0;
      color: #344957;
      font-size: clamp(17px, 2vw, 22px);
    }

    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 3px 8px;
      font: 700 10px var(--mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    [data-status="pass"] { color: #0d584f; background: var(--teal-soft); }
    [data-status="partial"] { color: #7b3c14; background: var(--amber-soft); }
    [data-status="failed"] { color: #7f2828; background: var(--red-soft); }
    [data-status="unverified"] { color: #44525c; background: var(--gray-soft); }
    [data-status="rejected"] { color: #4e5961; background: #eceff1; text-decoration: line-through; }

    .section {
      position: relative;
      margin: 38px 0 0;
      padding: clamp(24px, 4vw, 42px);
      border: 1px solid var(--line);
      border-left: 6px solid var(--blue);
      border-radius: 3px 18px 3px 3px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(30, 53, 68, 0.045);
    }
    .section::before {
      content: attr(data-step);
      position: absolute;
      top: 18px;
      right: 22px;
      color: #91a1aa;
      font: 11px var(--mono);
      letter-spacing: 0.1em;
    }
    h2 {
      margin: 0 48px 24px 0;
      font-family: var(--display);
      font-size: clamp(29px, 4vw, 42px);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    h3 { margin: 28px 0 10px; font-size: 16px; letter-spacing: 0.01em; }
    p { margin: 12px 0; }
    ul, ol { padding-left: 23px; }
    li { margin: 7px 0; }
    blockquote {
      margin: 22px 0;
      padding: 15px 20px;
      border-left: 4px solid var(--teal);
      background: var(--teal-soft);
      color: #264842;
    }
    code { font: 0.88em var(--mono); background: #edf2f5; padding: 0.12em 0.34em; border-radius: 4px; }
    pre {
      overflow-x: auto;
      padding: 18px;
      border: 1px solid #263945;
      border-radius: 8px;
      color: #e9f2f4;
      background: #1b2a34;
      font: 12px/1.6 var(--mono);
    }
    pre code { padding: 0; color: inherit; background: transparent; }
    .table-wrap { overflow-x: auto; margin: 20px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: #3d505d; background: #edf3f6; font: 700 10px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }

    .empty { padding: 40px; border: 1px dashed var(--line); background: var(--surface); }

    @media (max-width: 820px) {
      .shell { display: block; padding: 82px 16px 50px; }
      .trace { display: none; }
      .topbar { padding: 0 14px; }
      .brand span { display: none; }
      .hero { min-height: 270px; padding: 34px 26px; }
      .hero::after { display: none; }
      .section { padding: 26px 22px; }
    }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    @media print {
      @page { margin: 0.55in; }
      body { background: #fff; font-size: 10pt; }
      .topbar, .trace { display: none; }
      .shell { display: block; max-width: none; padding: 0; }
      .hero, .section { break-inside: avoid; box-shadow: none; margin-top: 18px; }
      .hero { min-height: 0; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>Evidence brief</strong><span>problem to proof</span></div>
    <div class="actions">
      <button type="button" id="previous">Previous</button>
      <button type="button" id="next">Next</button>
      <button type="button" onclick="window.print()">Print</button>
    </div>
  </header>
  <div class="shell">
    <nav class="trace" id="trace" aria-label="Presentation sections"></nav>
    <main id="deck" tabindex="-1"></main>
  </div>
  <textarea id="source" hidden>
